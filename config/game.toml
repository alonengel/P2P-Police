# Private per-peer configuration (rulebook Appendix B).
# Bright-line rule: anything both sides must agree on lives in game.json (signed);
# NOTHING game-relevant may live here. game.json always overrides on key overlap.

version = "1.10"

[game]
group_name = "anrbj666"
group_id = "anrbj666"          # 8-character team code, no spaces (rule 45)
sub_game_number = 1
members = ["Alon Engel", "Renat Karimov"]
counted_games_played = 0    # UPDATE before every counted game (rules 37-38)
repos = { cop = "https://github.com/alonengel/P2P-Police", thief = "https://github.com/alonengel/P2P-Thief" }
mcp_servers = { cop = "https://cop-mcp.alon.website/mcp", thief = "https://thief-mcp.alon.website/mcp" }

[network]
my_port = 8802                                  # police MCP server port
opponent_url = "https://thief.imreeyal.com/mcp"  # series-test overlay (local only)      # the ONLY thing we know about the opponent
turn_timeout_seconds = 180
wire_shape = "bookletter"       # default lockstep wire; "reference" arms the hidden-information
                                # (reference-v3) path and declares wire_shape_sha256 at negotiation
agreement_repush_sec = 7.0      # hidden-wire negotiate: re-send our agreement this often until the
                                # rival's arrives (dedup-safe; turn_timeout_seconds still bounds it)

# [strategy]  -- optional: point at your brain subclass (else the shipped heuristic runs)
# police_class = "p2p_police.strategy.police_brain:PoliceBrain"

[deception]                       # self-mirror lie policy (intent flags stay sealed until audit)
max_lies = 2                      # conservative cop budget -- lie only while closing in
cooldown_turns = 6                # minimum full turns between lies
exposure_threshold = 0.4          # mirror mass at/near our true cell that arms a lie (a moving
                                  # cop reads lower than a camper: rivals see us pre-boundary)
opponent_distance_threshold = 2   # believed thief Manhattan distance: mask the final approach
exposure_radius = 1               # Manhattan radius of the exposure mass
baseline_truth_probability = 0.5  # control arm (plain coin) for the policy-vs-coin experiment

[trash_talk]
provider = "template"           # template (0 tokens) | ollama | claude_api | claude_cli | openrouter
every_n_steps = 1

[llm]
model = ""
step_deadline_seconds = 30      # hard cap on LLM thinking per step

[email]
recipient = "alonisrael.engel@gmail.com, Imree.c@gmail.com"  # warm-up posture: reports reach ONLY us; league address restored per counted game
mode = "disabled"               # dev default; league games switch to "send" (rule 32: automatic reporting)

[resume]                        # crash-resume snapshots (peer/resume.py) - pure LOCAL persistence
enabled = true                  # ON by default: per-half-turn snapshot -> results/local/resume_*.json
drill_turn_timeout_seconds = 15.0   # resume drill turn budget (a resume must fit the rival's window)
drill_retry_backoff_sec = 0.2       # drill-scale transport backoff
drill_crash_after_half_turns = 6    # kill-and-resume drill: crash after this many half-turns
drill_my_seed = 7                   # deterministic brain pair for the drill
drill_stub_seed = 99
drill_stub_patience_factor = 3.0    # stub deadline spans the crash window (its clock starts pre-crash)

[fuzz]                          # legal-config-range fuzzer knobs (scripts/config_fuzz.py) - dev tooling
samples = 40                    # committed-artifact sample count
seed = 20260721                 # reproducible sampling of the LEGAL config space
turn_timeout_seconds = 30.0     # per-wait budget for the in-process fuzz games
retry_backoff_sec = 0.2
grid_size_max = 11              # upper fuzz bounds; lower bounds are the book's minimums
max_barriers_max = 24
max_moves_max = 60

[chaos]                         # chaos-drill knobs (scripts/chaos_drills.py) - dev tooling, never game terms
turn_timeout_seconds = 4.0      # shrunk turn budget so drills classify in seconds, not minutes
retry_backoff_sec = 0.2         # drill-scale transport backoff (league value stays in game.json)
watchdog_timeout_sec = 1.0      # drill-scale watchdog window (league value stays in game.json)
duplicate_stub_turn = 2         # D1: resend the stub's 2nd commit+reveal pair
silent_stub_turn = 3            # D2: the stub goes dark before its 3rd own turn
flap_after_full_turns = 2       # D3/D4: kill the opponent endpoint after this many full turns
flap_seconds = 1.5              # D3: endpoint downtime (must stay under the turn budget)
my_seed = 7                     # deterministic RandomBrain pair (observed: 35-turn survival game)
stub_seed = 99
duplicate_outbound_sends = false            # D5 sender half: resend every outbound turn push
                                            # (also armed by `peer --duplicate-outbound`)
duplicate_outbound_evidence_dir = "docs/evidence/drills"    # JSONL sink for duplicated sends
tunnel_turn_timeout_seconds = 90    # public-tunnel drill needs headroom for edge reconnects
tunnel_retry_backoff_sec = 1.0      # gentler backoff against the public edge
tunnel_ready_timeout_seconds = 90   # max wait for the tunnel to publish both hostnames
tunnel_kill_after_full_turns = 2    # kill cloudflared after this many full turns
tunnel_downtime_seconds = 6.0       # how long the tunnel stays dead before restart
tunnel_name = "copthief"            # named tunnel (docs/DEPLOYMENT.md); hostnames from [game].mcp_servers
cloudflared_exe = 'C:\Program Files (x86)\cloudflared\cloudflared.exe'

[strategy.endgame]              # exact endgame solver (belief-support minimax; keep-gate: docs/evidence/cop-strength.md)
enabled = false                 # keep-gate FAILED: 0 solver fires in 160 games -- the scent-floor
                                # belief never sharpens to a provable support (honest negative result)
max_support_cells = 3           # run only when the belief support is this sharp
support_mass_threshold = 0.05   # cells at/above this belief mass form the support
max_horizon_turns = 5           # lookahead in full turns; effective horizon = min(this, turns left)
node_cap = 20000                # search states before deferring to the heuristic brain
time_cap_ms = 150.0             # wall-clock cap -- optimality is never worth the turn deadline

[strategy.info_gain]            # expected belief-entropy-reduction move term (same keep-gate doc)
enabled = false                 # keep-gate FAILED: capture rate unmoved at every weight swept (0.5-4.0)
weight = 1.0                    # entropy nats traded per BFS step in the blended score
match_tolerance = 0.08          # kernel readings this close are indistinguishable
mismatch_likelihood = 0.15      # belief mass retained by hypotheses the reading refutes
